[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quanta"
version = "0.3.0"
description = "Quanta: OpenAI-compatible FastAPI bridge for local AI CLIs, including client-side tool calling"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<10", "openai>=1.60,<3"]

[dependency-groups]
test = ["httpx>=0.27,<1", "pytest>=8,<10", "openai>=1.60,<3"]

[project.scripts]
quanta = "quanta.cli:main"
global-api = "quanta.cli:main"

[tool.setuptools.packages.find]
include = ["quanta*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
